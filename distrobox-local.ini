[quartus-prime-lite-ubuntu]
image=quartus-prime-lite-installer:local
home=~/.local/share/quartus-prime-lite-ubuntu
init_hooks=/usr/local/bin/quartus-init >/home/tobias/.cache/quartus-prime-lite-installer-log 2>/home/tobias/.cache/quartus-prime-lite-installer-elog;
exported_bins="/usr/local/bin/quartus-install"
additional_flags=--env SHELL=/bin/bash --platform linux/amd64
