on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: docker
    container:
      image: codeberg.org/tobilinz/quartus-prime-lite-installer-cicd:latest
      options: --privileged
    steps:
      - name: Test
        run: |
          echo "REF_NAME: ${{ forgejo.ref_name }}"
          echo "HEAD_REF: ${{ forgejo.head_ref }}"
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ forgejo.head_ref }}

      - name: Register QEMU binfmt handlers
        run: |
          podman run --rm --privileged docker.io/tonistiigi/binfmt:latest --install all

      - name: Build
        run: |
          podman build --platform linux/amd64 -f container/Containerfile -t amd64-tmp ./container
          podman build --platform linux/arm64 -f container/Containerfile -t arm64-tmp ./container

      - name: Create Manifest
        run: |
          podman manifest create quartus-prime-lite-installer:latest
          podman manifest add quartus-prime-lite-installer:latest containers-storage:localhost/amd64-tmp
          podman manifest add quartus-prime-lite-installer:latest containers-storage:localhost/arm64-tmp

      - name: Publish
        run: |
          podman login codeberg.org --username tobilinz --password ${{ secrets.QUARTUS_PACKAGE_TOKEN }}
          podman manifest push quartus-prime-lite-installer:latest docker://codeberg.org/tobilinz/quartus-prime-lite-installer:${{ forgejo.ref_name }}
          podman manifest push quartus-prime-lite-installer:latest docker://codeberg.org/tobilinz/quartus-prime-lite-installer:latest

      - name: Cleanup
        run: |
          podman rmi amd64-tmp arm64-tmp
