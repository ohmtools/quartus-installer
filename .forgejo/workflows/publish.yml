on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: docker
    container:
      image: quay.io/podman/stable:latest
    steps:
      - name: Install Dependencies
        run: |
          dnf install -y git curl nodejs
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ forgejo.head_ref }}
      - name: Build
        run: |
          podman build -t codeberg.org/tobilinz/quartus-prime-lite-installer:${{ forgejo.ref_name }} .
      - name: Publish
        run: |
          podman login codeberg.org --username tobilinz --password ${{ secrets.QUARTUS_PACKAGE_TOKEN }}
          podman push codeberg.org/tobilinz/quartus-prime-lite-installer:${{ forgejo.ref_name }}
