on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: docker
    container:
      image: codeberg.org/tobilinz/quartus-installer-cicd:latest
      options: --privileged
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ forgejo.ref_name }}

      - name: Register QEMU binfmt handlers
        run: |
          podman run --rm --privileged docker.io/tonistiigi/binfmt:latest --install all

      - name: Build
        run: |
          podman build --platform linux/amd64 -f container/Containerfile -t amd64-tmp ./container &
          PID_AMD64=$!
          podman build --platform linux/arm64 -f container/Containerfile -t arm64-tmp ./container &
          PID_ARM64=$!

          wait $PID_AMD64 || { echo "ERROR: amd64 build failed"; exit 1; }
          wait $PID_ARM64 || { echo "ERROR: arm64 build failed"; exit 1; }

      - name: Create Manifest
        run: |
          podman manifest create quartus-installer:latest
          podman manifest add quartus-installer:latest containers-storage:localhost/amd64-tmp
          podman manifest add quartus-installer:latest containers-storage:localhost/arm64-tmp

      - name: Publish
        run: |
          podman login codeberg.org --username tobilinz --password ${{ secrets.QUARTUS_PACKAGE_TOKEN }}
          podman manifest push quartus-installer:latest docker://codeberg.org/tobilinz/quartus-installer:${{ forgejo.ref_name }}
          podman manifest push quartus-installer:latest docker://codeberg.org/tobilinz/quartus-installer:latest

      - name: Cleanup
        if: always()
        run: |
          podman rmi amd64-tmp arm64-tmp || true
          podman manifest rm quartus-installer:latest || true
