on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    runs-on: docker
    container:
      image: codeberg.org/tobilinz/quartus-prime-lite-installer-cicd:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ forgejo.head_ref }}
      - name: Build
        run: |
          podman build -t codeberg.org/tobilinz/quartus-prime-lite-installer:${{ forgejo.ref_name }} ./container
      - name: Publish
        run: |
          podman login codeberg.org --username tobilinz --password ${{ secrets.QUARTUS_PACKAGE_TOKEN }}
          podman push codeberg.org/tobilinz/quartus-prime-lite-installer:${{ forgejo.ref_name }}
      - name: Tag Latest
        run: |
          podman tag quartus-prime-lite-installer:${{ forgejo.ref_name}} codeberg.org/tobilinz/quartus-prime-lite-installer:latest
          podman push codeberg.org/tobilinz/quartus-prime-lite-installer:latest
